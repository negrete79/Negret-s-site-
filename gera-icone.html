<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerar ícones — Sítio Esperança</title>
<style>
  body{ font-family:system-ui,sans-serif; background:#FFF8E1; color:#1C1917; display:grid; place-items:center; min-height:100vh; margin:0; }
  .card{ background:#fff; border-radius:20px; padding:32px; box-shadow:0 10px 40px rgba(46,125,50,.15); text-align:center; max-width:420px; }
  h1{ font-size:18px; margin:0 0 4px; } p{ font-size:13px; color:#78716C; margin:0 0 20px; }
  button{ display:block; width:100%; margin:8px 0; padding:13px; border:0; border-radius:12px;
    background:#2E7D32; color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  button:active{ transform:scale(.97); }
  button.alt{ background:#FFF8E1; color:#2E7D32; border:1px solid #E7DDC0; }
</style>
</head>
<body>
<div class="card">
  <h1>🐰 Ícones do Sítio Esperança</h1>
  <p>Clique para gerar e baixar os PNGs. Coloque-os dentro da pasta <b>icons/</b>.</p>
  <button onclick="baixar('normal',192)">⬇️ icon-192.png</button>
  <button onclick="baixar('normal',512)">⬇️ icon-512.png</button>
  <button class="alt" onclick="baixar('maskable',192)">⬇️ icon-maskable-192.png</button>
  <button class="alt" onclick="baixar('maskable',512)">⬇️ icon-maskable-512.png</button>
</div>

<script>
const SVGS = {
  normal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#1B5E20"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#bg)"/><g transform="translate(10 11) scale(1.25)"><ellipse cx="24" cy="18" rx="6.2" ry="11.5" transform="rotate(-14 24 18)" fill="#FFF8E1"/><ellipse cx="40" cy="18" rx="6.2" ry="11.5" transform="rotate(14 40 18)" fill="#FFF8E1"/><ellipse cx="24.5" cy="19" rx="2.4" ry="6.5" transform="rotate(-14 24.5 19)" fill="#A5D6A7"/><ellipse cx="39.5" cy="19" rx="2.4" ry="6.5" transform="rotate(14 39.5 19)" fill="#A5D6A7"/><circle cx="32" cy="41.5" r="15.5" fill="#FFF8E1"/><circle cx="26.5" cy="40" r="2.1" fill="#2E7D32"/><circle cx="37.5" cy="40" r="2.1" fill="#2E7D32"/><path d="M29.2 46h5.6L32 49.6z" fill="#2E7D32"/></g></svg>`,
  maskable: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#1B5E20"/></linearGradient></defs><rect width="100" height="100" fill="url(#bgm)"/><g transform="translate(21 21.5) scale(0.9)"><ellipse cx="24" cy="18" rx="6.2" ry="11.5" transform="rotate(-14 24 18)" fill="#FFF8E1"/><ellipse cx="40" cy="18" rx="6.2" ry="11.5" transform="rotate(14 40 18)" fill="#FFF8E1"/><ellipse cx="24.5" cy="19" rx="2.4" ry="6.5" transform="rotate(-14 24.5 19)" fill="#A5D6A7"/><ellipse cx="39.5" cy="19" rx="2.4" ry="6.5" transform="rotate(14 39.5 19)" fill="#A5D6A7"/><circle cx="32" cy="41.5" r="15.5" fill="#FFF8E1"/><circle cx="26.5" cy="40" r="2.1" fill="#2E7D32"/><circle cx="37.5" cy="40" r="2.1" fill="#2E7D32"/><path d="M29.2 46h5.6L32 49.6z" fill="#2E7D32"/></g></svg>`
};

function baixar(tipo, size){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    c.getContext('2d').drawImage(img, 0, 0, size, size);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `icon-${tipo === 'maskable' ? 'maskable-' : ''}${size}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVGS[tipo]);
}
</script>
</body>
</html>
